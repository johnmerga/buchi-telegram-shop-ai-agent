services:
  - type: web
    name: buchi
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    # --prod=false installs devDependencies, which the build needs, even though NODE_ENV is production.
    # Builds the server and the web app, which the server serves under /app.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm -r build
    # Runs pending migrations before the server starts. Plain node avoids fetching pnpm at runtime.
    startCommand: node apps/server/dist/migrate.js && node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Cloudflare, Render's edge, and a local proxy sit in front of the app (seen in production logs).
      - key: TRUST_PROXY_HOPS
        value: '3'
      - key: DATABASE_URL
        sync: false
      - key: JOB_SECRET
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RISK_HASH_SECRET
        sync: false
      - key: ORS_API_KEY
        sync: false
      # The service's public HTTPS address, for the chat's Mini App buttons.
      - key: WEB_APP_URL
        sync: false
      # Optional: the Google service account for the owners' Sheets ledgers.
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
