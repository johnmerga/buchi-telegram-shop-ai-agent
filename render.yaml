services:
  - type: web
    name: buchi
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    # --prod=false installs devDependencies, which the build needs, even though NODE_ENV is production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @buchi/server build
    # Runs pending migrations before the server starts. Plain node avoids fetching pnpm at runtime.
    startCommand: node apps/server/dist/migrate.js && node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
